# Profil de production : PostgreSQL + schéma versionné par Flyway.
# Toutes les valeurs sensibles sont lues depuis des variables d'environnement
# (voir docker-compose.yml) ; ne jamais committer de vrais identifiants ici.
server.port=${SERVER_PORT:8090}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/computers}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Le schéma est entièrement piloté par les migrations Flyway : Hibernate ne
# doit jamais le modifier lui-même en prod, seulement le valider.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Profil actif par défaut : développement local avec H2 en mémoire.
# Utiliser --spring.profiles.active=prod (ou SPRING_PROFILES_ACTIVE=prod) pour
# basculer sur PostgreSQL + Flyway (voir application-prod.properties).
spring.application.name=controleJ2e

server.port=8090

spring.datasource.url=jdbc:h2:mem:computers-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Flyway géré uniquement en profil "prod" (schéma Postgres versionné) ;
# en dev/H2, Hibernate gère le schéma directement (ddl-auto=update).
spring.flyway.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Profil actif par défaut : développement local avec H2 en mémoire.
# Utiliser --spring.profiles.active=prod (ou SPRING_PROFILES_ACTIVE=prod) pour
# basculer sur PostgreSQL + Flyway (voir application-prod.properties).
spring.application.name=controleJ2e

server.port=8090

spring.datasource.url=jdbc:h2:mem:computers-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Flyway géré uniquement en profil "prod" (schéma Postgres versionné) ;
# en dev/H2, Hibernate gère le schéma directement (ddl-auto=update).
spring.flyway.enabled=false

# Ne pas redéfinir springdoc.swagger-ui.path / springdoc.api-docs.path ici :
# même égales aux valeurs par défaut, ces clés font emprunter à springdoc-openapi
# 2.9.x un chemin de code différent qui génère un pattern de ressource invalide
# (/swagger-ui/**/*index.html) sous le PathPatternParser de Spring 6.2, et
# empêche l'application de démarrer. Les valeurs par défaut suffisent.
